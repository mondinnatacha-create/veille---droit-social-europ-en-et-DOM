[project]
name = "veille-droit-social-ue-dom"
version = "1.0.0"
description = "Agent de veille hebdomadaire sur le droit social europeen et des outre-mer"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows>=3.10,<4",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["apps/worker/src"]
